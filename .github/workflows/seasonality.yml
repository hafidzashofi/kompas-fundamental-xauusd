name: Update seasonality data

on:
  schedule:
    # Once a month, 1st day 07:00 WIB (00:00 UTC) -- history barely changes daily.
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build monthly seasonality stats
        run: python scripts/build_seasonality.py

      - name: Commit updated seasonality.json
        run: |
          git config user.name "kompas-xauusd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seasonality.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh seasonality data"
          git push
