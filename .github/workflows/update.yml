name: Update XAUUSD fundamental data

on:
  schedule:
    # 06:00 and 18:00 WIB (23:00 and 11:00 UTC)
    - cron: "0 23,11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest COT / calendar / price data
        run: python scripts/update_data.py

      - name: Commit updated data.json
        run: |
          git config user.name "kompas-xauusd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh fundamental data"
          git push
